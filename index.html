<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RESTO — электронное меню и управление заказами</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <div class="brand-logo">🍽️</div>
    <div class="brand-text"><b>RESTO</b><span>MENU &amp; ORDERS</span></div>
  </div>
  <nav class="nav">
    <button class="nav-btn active" data-act="view" data-id="guest">🍽️ <span data-i18n="menu"></span></button>
    <button class="nav-btn" data-act="view" data-id="kitchen">👨‍🍳 <span data-i18n="kitchen"></span></button>
    <button class="nav-btn" data-act="view" data-id="admin">📊 <span data-i18n="admin"></span></button>
  </nav>
  <div class="lang-switch">
    <button data-act="lang" data-id="uz">🇺🇿 UZ</button>
    <button data-act="lang" data-id="ru" class="active">🇷🇺 RU</button>
    <button data-act="lang" data-id="en">🇬🇧 EN</button>
  </div>
</header>

<main>
  <section id="view-guest" class="view active">
    <div class="guest-layout">
      <div class="menu-side">
        <div class="menu-toolbar">
          <div class="search-box">
            <span class="search-ico">🔍</span>
            <input id="searchInput" type="search" data-i18n-ph="search_ph" autocomplete="off"/>
          </div>
          <div class="table-chip" id="guestTableChip"></div>
        </div>
        <div class="cats" id="catTabs"></div>
        <div class="products" id="productGrid"></div>
      </div>
      <aside class="cart-side" id="cartPanel"></aside>
    </div>
    <button class="cart-fab" id="cartFab" data-act="cart-toggle">
      🛒 <span id="cartFabCount">0</span> · <span id="cartFabSum">0</span>
    </button>
  </section>

  <section id="view-kitchen" class="view">
    <div class="kitchen-head">
      <h2>👨‍🍳 <span data-i18n="kitchen"></span></h2>
      <div class="kitchen-tools">
        <label class="switch"><input type="checkbox" id="soundToggle" checked/><span data-i18n="sound_on"></span></label>
        <button class="btn ghost" data-act="kitchen-refresh" data-i18n="refresh"></button>
      </div>
    </div>
    <div class="kds" id="kdsBoard"></div>
  </section>

  <section id="view-admin" class="view">
    <div id="adminLogin" class="login-wrap">
      <form id="loginForm" class="login-card">
        <h2 data-i18n="login"></h2>
        <label class="field"><span data-i18n="login_ph"></span><input id="loginUser" value="admin" autocomplete="username"/></label>
        <label class="field"><span data-i18n="password_ph"></span><input id="loginPass" type="password" value="" autocomplete="current-password"/></label>
        <button class="btn primary block" type="submit" data-i18n="sign_in"></button>
        <p class="hint">admin / admin123</p>
      </form>
    </div>
    <div id="adminPanel" class="hidden">
      <div class="admin-bar">
        <div class="admin-tabs" id="adminTabs"></div>
        <button class="btn ghost" data-act="logout" data-i18n="logout"></button>
      </div>
      <div id="adminContent"></div>
    </div>
  </section>
</main>

<div id="toasts" class="toasts"></div>
<div id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
